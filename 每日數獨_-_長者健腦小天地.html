<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日數獨 - 媽媽的健腦小天地</title>
    <style>
        /* 護眼暖色調與長者友善高對比主題 */
        :root {
            --bg-cream: #FDFBF7;
            --card-bg: #FFFFFF;
            --text-dark: #26231F;
            --text-muted: #5C554C;
            --primary: #2A6F68;
            --primary-dark: #1D524C;
            --primary-light: #E6F2F0;
            --accent: #D97706;
            --accent-light: #FEF3C7;
            --cell-fixed: #EFECE6;
            --cell-selected: #FDE68A;
            --cell-related: #FEF9E7;
            --cell-same: #CBE8E4;
            --cell-error-bg: #FEE2E2;
            --cell-error-text: #B91C1C;
            --border-thin: #C7BFA9;
            --border-thick: #2C2824;
            --font-scale: 1;
        }

        /* 特大字體模式 */
        body.large-font {
            --font-scale: 1.18;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 12px 10px 32px 10px;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            line-height: 1.45;
        }

        .app-container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 頂部標題與字體切換列 */
        .header-card {
            background: var(--card-bg);
            border: 2px solid #E5DEC9;
            border-radius: 18px;
            padding: 14px 16px;
            box-shadow: 0 4px 12px rgba(44, 40, 36, 0.05);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .title-group h1 {
            margin: 0;
            font-size: calc(1.45rem * var(--font-scale));
            color: var(--primary-dark);
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .title-group p {
            margin: 3px 0 0 0;
            font-size: calc(0.9rem * var(--font-scale));
            color: var(--text-muted);
            font-weight: 500;
        }

        .font-toggle-btn {
            background-color: var(--accent-light);
            color: #92400E;
            border: 2px solid #F59E0B;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: calc(0.92rem * var(--font-scale));
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: transform 0.1s, background-color 0.2s;
        }

        .font-toggle-btn.active {
            background-color: #D97706;
            color: #FFFFFF;
            border-color: #B45309;
        }

        .font-toggle-btn:active {
            transform: scale(0.96);
        }

        /* 每日上午 9:00 自動更新與倒數橫幅 */
        .schedule-banner {
            margin-top: 10px;
            background-color: var(--primary-light);
            border: 1.5px solid #B8DCD7;
            border-radius: 12px;
            padding: 9px 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .schedule-date {
            font-size: calc(0.96rem * var(--font-scale));
            font-weight: 700;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px;
        }

        .daily-badge {
            background-color: var(--primary);
            color: #FFFFFF;
            font-size: calc(0.78rem * var(--font-scale));
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 700;
        }

        .daily-badge.practice {
            background-color: #D97706;
        }

        .schedule-countdown {
            font-size: calc(0.86rem * var(--font-scale));
            color: #2D5A54;
            font-weight: 600;
        }

        /* 成就統計與計時器列 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 2px solid #E5DEC9;
            border-radius: 14px;
            padding: 8px 6px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .stat-label {
            font-size: calc(0.8rem * var(--font-scale));
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-value {
            font-size: calc(1.15rem * var(--font-scale));
            font-weight: 800;
            color: var(--primary-dark);
            margin-top: 2px;
        }

        .timer-toggle-btn {
            background: transparent;
            border: none;
            color: var(--primary);
            font-size: calc(0.85rem * var(--font-scale));
            font-weight: 700;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 8px;
            text-decoration: underline;
        }

        /* 難度選擇按鈕組 */
        .difficulty-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .diff-btn {
            background: var(--card-bg);
            border: 2px solid #D6CEBA;
            color: var(--text-dark);
            border-radius: 14px;
            padding: 10px 4px;
            font-size: calc(0.95rem * var(--font-scale));
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .diff-btn span.sub {
            font-size: calc(0.75rem * var(--font-scale));
            font-weight: 500;
            color: var(--text-muted);
        }

        .diff-btn.active {
            background: var(--primary);
            border-color: var(--primary-dark);
            color: #FFFFFF;
            box-shadow: 0 3px 8px rgba(42, 111, 104, 0.25);
        }

        .diff-btn.active span.sub {
            color: #E0F2F1;
        }

        /* 貼心提示與狀態訊息橫幅 */
        .coach-banner {
            background-color: #FFFBEB;
            border: 2px solid #FCD34D;
            border-radius: 14px;
            padding: 10px 14px;
            font-size: calc(0.96rem * var(--font-scale));
            color: #78350F;
            font-weight: 600;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            min-height: 48px;
        }

        .coach-icon {
            font-size: 1.25rem;
            line-height: 1.2;
            flex-shrink: 0;
        }

        /* 數獨棋盤外框與網格 */
        .board-wrapper {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 18px;
            border: 2px solid #E5DEC9;
            box-shadow: 0 6px 16px rgba(44, 40, 36, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sudoku-grid {
            display: grid;
            width: 100%;
            aspect-ratio: 1 / 1;
            border: 3.5px solid var(--border-thick);
            border-radius: 6px;
            overflow: hidden;
            background-color: var(--border-thick);
        }

        .sudoku-grid.grid-6 {
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
        }

        .sudoku-grid.grid-9 {
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
        }

        .cell {
            background-color: #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            cursor: pointer;
            position: relative;
            border-right: 1px solid var(--border-thin);
            border-bottom: 1px solid var(--border-thin);
            transition: background-color 0.1s;
        }

        .grid-6 .cell {
            font-size: calc(1.85rem * var(--font-scale));
        }

        .grid-9 .cell {
            font-size: calc(1.42rem * var(--font-scale));
        }

        /* 粗宮格框線 */
        .cell.thick-right {
            border-right: 3px solid var(--border-thick);
        }

        .cell.thick-bottom {
            border-bottom: 3px solid var(--border-thick);
        }

        .cell.no-right {
            border-right: none;
        }

        .cell.no-bottom {
            border-bottom: none;
        }

        /* 格子狀態顏色 */
        .cell.fixed {
            background-color: var(--cell-fixed);
            color: #1F1D1A;
        }

        .cell.user-val {
            color: #1D4ED8;
        }

        .cell.related {
            background-color: var(--cell-related);
        }

        .cell.same-num {
            background-color: var(--cell-same);
        }

        .cell.selected {
            background-color: var(--cell-selected) !important;
            box-shadow: inset 0 0 0 2.5px #D97706;
        }

        .cell.error {
            background-color: var(--cell-error-bg) !important;
            color: var(--cell-error-text) !important;
        }

        /* 草稿筆記小字網格 */
        .notes-grid {
            display: grid;
            width: 100%;
            height: 100%;
            padding: 2px;
            pointer-events: none;
        }

        .grid-6 .notes-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
        }

        .grid-9 .notes-grid {
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
        }

        .note-num {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(0.68rem * var(--font-scale));
            font-weight: 700;
            color: #57534E;
            line-height: 1;
        }

        .grid-6 .note-num {
            font-size: calc(0.85rem * var(--font-scale));
        }

        /* 數字輸入鍵盤 */
        .numpad {
            display: grid;
            gap: 8px;
            width: 100%;
        }

        .numpad.pad-6 {
            grid-template-columns: repeat(6, 1fr);
        }

        .numpad.pad-9 {
            grid-template-columns: repeat(9, 1fr);
        }

        .num-btn {
            background-color: #FFFFFF;
            border: 2px solid #C7BFA9;
            border-bottom-width: 4px;
            border-radius: 14px;
            padding: 12px 0;
            font-size: calc(1.45rem * var(--font-scale));
            font-weight: 800;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.08s, background-color 0.15s;
        }

        .num-btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
            background-color: var(--primary-light);
        }

        .num-btn.completed {
            opacity: 0.4;
            background-color: #F3F4F6;
        }

        .num-btn.note-mode-active {
            border-color: #D97706;
            color: #92400E;
            background-color: #FFFBEB;
        }

        /* 輔助功能操作按鈕列 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .tool-btn {
            background-color: #FFFFFF;
            border: 2px solid #D6CEBA;
            border-radius: 14px;
            padding: 10px 4px;
            font-size: calc(0.9rem * var(--font-scale));
            font-weight: 700;
            color: var(--text-dark);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.15s;
        }

        .tool-btn .t-icon {
            font-size: 1.25rem;
        }

        .tool-btn:active {
            transform: scale(0.96);
        }

        .tool-btn.active {
            background-color: #FEF3C7;
            border-color: #D97706;
            color: #92400E;
        }

        .tool-btn.hint-btn {
            background-color: var(--primary-light);
            border-color: #84C5BE;
            color: var(--primary-dark);
        }

        /* 底部「今日題目 / 練習新題」切換列 */
        .bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 2px;
        }

        .action-main-btn {
            border: none;
            border-radius: 14px;
            padding: 13px 10px;
            font-size: calc(1rem * var(--font-scale));
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .action-main-btn:active {
            transform: scale(0.97);
        }

        .btn-daily {
            background-color: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 10px rgba(42, 111, 104, 0.25);
        }

        .btn-practice {
            background-color: #EFECE6;
            color: var(--text-dark);
            border: 2px solid #D6CEBA;
        }

        /* 過關祝賀彈窗 */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(38, 35, 31, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-card {
            background: #FFFFFF;
            border: 3px solid #F59E0B;
            border-radius: 24px;
            padding: 24px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.25);
            position: relative;
            z-index: 1002;
        }

        .modal-emoji {
            font-size: 3.5rem;
            margin-bottom: 8px;
        }

        .modal-title {
            font-size: calc(1.5rem * var(--font-scale));
            font-weight: 800;
            color: var(--primary-dark);
            margin: 0 0 8px 0;
        }

        .modal-desc {
            font-size: calc(1.05rem * var(--font-scale));
            color: var(--text-dark);
            margin: 0 0 16px 0;
            line-height: 1.5;
        }

        .modal-stats {
            background: #FDFBF7;
            border: 1.5px solid #E5DEC9;
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 18px;
            font-size: calc(0.95rem * var(--font-scale));
            font-weight: 700;
            color: var(--primary-dark);
        }

        .modal-btns {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 彩帶畫布 */
        #confetti-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1001;
        }

        /* 錯誤備援顯示框 */
        #error-fallback {
            display: none;
            background: #FEE2E2;
            border: 2px solid #EF4444;
            color: #991B1B;
            padding: 16px;
            border-radius: 14px;
            margin: 16px;
            font-weight: 700;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="error-fallback"></div>

    <div class="app-container" id="app-root">
        <!-- 頂部標題與每日 9:00 自動更新狀態列 -->
        <header class="header-card">
            <div class="header-top">
                <div class="title-group">
                    <h1>🧩 每日數獨</h1>
                    <p>媽媽的健腦小天地 · 訓練思維與記憶</p>
                </div>
                <button type="button" id="font-toggle-btn" class="font-toggle-btn" aria-label="切換特大字體">
                    🔍 特大字體
                </button>
            </div>

            <div class="schedule-banner">
                <div class="schedule-date">
                    <span id="hk-date-text">📅 正在載入香港日期...</span>
                    <span id="puzzle-type-badge" class="daily-badge">今日每日題</span>
                </div>
                <div class="schedule-countdown" id="hk-countdown-text">
                    ⏰ 每日上午 09:00 自動設計新題目
                </div>
            </div>
        </header>

        <!-- 成就記錄與可選計時器 -->
        <section class="stats-row" aria-label="練習記錄">
            <div class="stat-box">
                <span class="stat-label">🏆 已完成題數</span>
                <span class="stat-value" id="stat-solved">0 題</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">🔥 連續打卡</span>
                <span class="stat-value" id="stat-streak">0 日</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">⏱️ 輕鬆計時</span>
                <div id="timer-container">
                    <button type="button" id="timer-toggle-btn" class="timer-toggle-btn">顯示時間</button>
                </div>
            </div>
        </section>

        <!-- 三種難度切換 -->
        <section class="difficulty-bar" aria-label="選擇難度">
            <button type="button" class="diff-btn active" data-diff="6x6">
                <span>輕鬆 6×6</span>
                <span class="sub">暖身推薦</span>
            </button>
            <button type="button" class="diff-btn" data-diff="9x9-easy">
                <span>標準 9×9</span>
                <span class="sub">經典簡單</span>
            </button>
            <button type="button" class="diff-btn" data-diff="9x9-medium">
                <span>進階 9×9</span>
                <span class="sub">動腦挑戰</span>
            </button>
        </section>

        <!-- 貼心引導訊息區 -->
        <div class="coach-banner" id="coach-banner" role="status" aria-live="polite">
            <span class="coach-icon" id="coach-icon">🌼</span>
            <span id="coach-text">歡迎！點選任何一個空白格子，再按下方數字鍵就可以開始玩啦。</span>
        </div>

        <!-- 數獨棋盤 -->
        <main class="board-wrapper">
            <div id="sudoku-grid" class="sudoku-grid grid-6" role="grid" aria-label="數獨棋盤"></div>
        </main>

        <!-- 數字輸入鍵盤 -->
        <section id="numpad" class="numpad pad-6" aria-label="數字鍵盤"></section>

        <!-- 輔助工具按鈕 -->
        <section class="tools-grid" aria-label="輔助工具">
            <button type="button" class="tool-btn" id="btn-note">
                <span class="t-icon">✏️</span>
                <span>筆記模式</span>
            </button>
            <button type="button" class="tool-btn" id="btn-clear">
                <span class="t-icon">🧹</span>
                <span>清除</span>
            </button>
            <button type="button" class="tool-btn" id="btn-check">
                <span class="t-icon">🔍</span>
                <span>幫我檢查</span>
            </button>
            <button type="button" class="tool-btn hint-btn" id="btn-hint">
                <span class="t-icon">💡</span>
                <span>貼心提示</span>
            </button>
        </section>

        <!-- 每日題目與額外練習按鈕 -->
        <section class="bottom-actions">
            <button type="button" class="action-main-btn btn-daily" id="btn-today-puzzle">
                📅 玩今日每日題
            </button>
            <button type="button" class="action-main-btn btn-practice" id="btn-new-practice">
                🎲 練習新題
            </button>
        </section>
    </div>

    <!-- 彩帶慶祝畫布 -->
    <canvas id="confetti-canvas"></canvas>

    <!-- 過關祝賀彈窗 -->
    <div class="modal-overlay" id="win-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div class="modal-emoji">🎉🌸👏</div>
            <h2 class="modal-title" id="modal-title">太叻啦！成功過關！</h2>
            <p class="modal-desc" id="modal-praise">
                媽媽思維好清晰、觀察力好敏銳！每日動動腦筋，越玩越精靈！
            </p>
            <div class="modal-stats" id="modal-stats-summary">
                累計完成：1 題 ｜ 連續打卡：1 日
            </div>
            <div class="modal-btns">
                <button type="button" class="action-main-btn btn-daily" id="modal-next-practice">
                    🎲 再玩一局新題目
                </button>
                <button type="button" class="action-main-btn btn-practice" id="modal-close-btn">
                    欣賞完成棋盤
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ==========================================
            // 1. 安全儲存空間封裝（相容沙盒 iframe 環境）
            // ==========================================
            const memoryStorage = {};
            const SafeStorage = {
                get(key, fallback) {
                    try {
                        const val = window.localStorage.getItem(key);
                        return val !== null ? JSON.parse(val) : fallback;
                    } catch (e) {
                        return Object.prototype.hasOwnProperty.call(memoryStorage, key)
                            ? memoryStorage[key]
                            : fallback;
                    }
                },
                set(key, value) {
                    memoryStorage[key] = value;
                    try {
                        window.localStorage.setItem(key, JSON.stringify(value));
                    } catch (e) {
                        // 在嚴格沙盒中自動降級為記憶體儲存，不中斷程式
                    }
                }
            };

            // ==========================================
            // 2. 香港時間 (UTC+8) 每日上午 09:00 排程計算
            // ==========================================
            function getHKScheduleState() {
                const now = new Date();
                const utcMs = now.getTime() + (now.getTimezoneOffset() * 60000);
                const hkNow = new Date(utcMs + (8 * 3600000));

                // 若未到香港時間上午 09:00，題目日期屬於前一日
                const puzzleDate = new Date(hkNow.getTime());
                if (hkNow.getHours() < 9) {
                    puzzleDate.setDate(puzzleDate.getDate() - 1);
                }

                const yyyy = puzzleDate.getFullYear();
                const mm = String(puzzleDate.getMonth() + 1).padStart(2, '0');
                const dd = String(puzzleDate.getDate()).padStart(2, '0');
                const dateKey = `${yyyy}-${mm}-${dd}`;

                const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                const weekdayStr = weekdays[puzzleDate.getDay()];

                // 計算距離下一個香港時間上午 09:00 的剩餘秒數
                const next9AM = new Date(hkNow.getTime());
                next9AM.setHours(9, 0, 0, 0);
                if (hkNow.getHours() >= 9) {
                    next9AM.setDate(next9AM.getDate() + 1);
                }

                const diffSec = Math.max(0, Math.floor((next9AM.getTime() - hkNow.getTime()) / 1000));
                const h = String(Math.floor(diffSec / 3600)).padStart(2, '0');
                const m = String(Math.floor((diffSec % 3600) / 60)).padStart(2, '0');
                const s = String(diffSec % 60).padStart(2, '0');

                const isTomorrow = hkNow.getHours() >= 9;
                const countdownLabel = isTomorrow
                    ? `⏰ 距離明日 09:00 更新還有 ${h}:${m}:${s}`
                    : `⏰ 距離今日 09:00 更新還有 ${h}:${m}:${s}`;

                return {
                    dateKey,
                    dateDisplay: `📅 ${yyyy}年${puzzleDate.getMonth() + 1}月${puzzleDate.getDate()}日（${weekdayStr}）`,
                    countdownLabel
                };
            }

            // ==========================================
            // 3. 確定性種子亂數生成器 (Mulberry32)
            // ==========================================
            function hashStringToSeed(str) {
                let h = 1779033703 ^ str.length;
                for (let i = 0; i < str.length; i++) {
                    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
                    h = (h << 13) | (h >>> 19);
                }
                return function() {
                    h = Math.imul(h ^ (h >>> 16), 2246822507);
                    h = Math.imul(h ^ (h >>> 13), 3266489909);
                    return (h ^= h >>> 16) >>> 0;
                };
            }

            function createMulberry32(seedStr) {
                const seedGen = hashStringToSeed(seedStr);
                let a = seedGen();
                return function() {
                    let t = (a += 0x6D2B79F5);
                    t = Math.imul(t ^ (t >>> 15), t | 1);
                    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function seededShuffle(array, rng) {
                const arr = array.slice();
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(rng() * (i + 1));
                    const temp = arr[i];
                    arr[i] = arr[j];
                    arr[j] = temp;
                }
                return arr;
            }

            // ==========================================
            // 4. 真實數獨演算法生成器（支援 6x6 與 9x9 唯一解）
            // ==========================================
            function generateSudokuPuzzle(difficulty, seedStr) {
                const rng = createMulberry32(seedStr);
                const is6x6 = difficulty === '6x6';
                const size = is6x6 ? 6 : 9;
                const boxRows = is6x6 ? 2 : 3;
                const boxCols = 3;
                const totalCells = size * size;

                const solution = new Array(totalCells).fill(0);

                function isValidPlacement(board, row, col, num) {
                    // 檢查同行與同列
                    for (let i = 0; i < size; i++) {
                        if (board[row * size + i] === num) return false;
                        if (board[i * size + col] === num) return false;
                    }
                    // 檢查同宮格
                    const startRow = Math.floor(row / boxRows) * boxRows;
                    const startCol = Math.floor(col / boxCols) * boxCols;
                    for (let r = 0; r < boxRows; r++) {
                        for (let c = 0; c < boxCols; c++) {
                            if (board[(startRow + r) * size + (startCol + c)] === num) {
                                return false;
                            }
                        }
                    }
                    return true;
                }

                // 回溯法生成完整終盤
                function fillBoard(idx) {
                    if (idx === totalCells) return true;
                    const row = Math.floor(idx / size);
                    const col = idx % size;
                    const nums = seededShuffle(
                        Array.from({ length: size }, (_, i) => i + 1),
                        rng
                    );
                    for (let i = 0; i < nums.length; i++) {
                        const num = nums[i];
                        if (isValidPlacement(solution, row, col, num)) {
                            solution[idx] = num;
                            if (fillBoard(idx + 1)) return true;
                            solution[idx] = 0;
                        }
                    }
                    return false;
                }

                fillBoard(0);

                // 計算解的數量（最多算到 2 個以驗證唯一解）
                function countSolutions(board, limit) {
                    let emptyIdx = -1;
                    let minOptions = size + 1;
                    let bestCandidates = null;

                    for (let i = 0; i < totalCells; i++) {
                        if (board[i] === 0) {
                            const r = Math.floor(i / size);
                            const c = i % size;
                            const candidates = [];
                            for (let n = 1; n <= size; n++) {
                                if (isValidPlacement(board, r, c, n)) {
                                    candidates.push(n);
                                }
                            }
                            if (candidates.length === 0) return 0;
                            if (candidates.length < minOptions) {
                                minOptions = candidates.length;
                                emptyIdx = i;
                                bestCandidates = candidates;
                                if (minOptions === 1) break;
                            }
                        }
                    }

                    if (emptyIdx === -1) return 1;

                    let found = 0;
                    for (let i = 0; i < bestCandidates.length; i++) {
                        board[emptyIdx] = bestCandidates[i];
                        found += countSolutions(board, limit);
                        board[emptyIdx] = 0;
                        if (found >= limit) return found;
                    }
                    return found;
                }

                // 依難度挖空並確保題目具備唯一解
                const targetBlanks = difficulty === '6x6'
                    ? 14
                    : (difficulty === '9x9-easy' ? 34 : 44);

                const puzzle = solution.slice();
                const positions = seededShuffle(
                    Array.from({ length: totalCells }, (_, i) => i),
                    rng
                );

                let removed = 0;
                for (let i = 0; i < positions.length && removed < targetBlanks; i++) {
                    const pos = positions[i];
                    const backup = puzzle[pos];
                    puzzle[pos] = 0;

                    const testBoard = puzzle.slice();
                    if (countSolutions(testBoard, 2) === 1) {
                        removed++;
                    } else {
                        puzzle[pos] = backup;
                    }
                }

                return {
                    size,
                    boxRows,
                    boxCols,
                    puzzle,
                    solution
                };
            }

            // ==========================================
            // 5. 遊戲狀態管理
            // ==========================================
            const state = {
                difficulty: '6x6',
                isDailyMode: true,
                currentDailyDateKey: '',
                practiceCounter: 0,
                size: 6,
                boxRows: 2,
                boxCols: 3,
                initial: [],
                solution: [],
                board: [],
                notes: [], // 每個格子為 Set
                errors: [], // 每個格子為 boolean
                selectedIdx: null,
                noteMode: false,
                isCompleted: false,
                largeFont: SafeStorage.get('mom_sudoku_large_font', false),
                showTimer: false,
                elapsedSeconds: 0,
                timerInterval: null,
                stats: SafeStorage.get('mom_sudoku_stats', {
                    solvedCount: 0,
                    streakDays: 0,
                    lastSolvedDate: ''
                })
            };

            const PRAISE_MESSAGES = [
                '媽媽思維好清晰、觀察力好敏銳！每日動動腦筋，越玩越精靈！',
                '好犀利呀！一格一格推理得井井有條，邏輯能力一百分！',
                '太棒啦！輕鬆解開今日數獨，幫大腦做了一次好舒服的體操！',
                '真係好有耐心同智慧！全盤數字完全正確，值得飲杯靚茶獎勵下自己！'
            ];

            // ==========================================
            // 6. DOM 參照與介面更新
            // ==========================================
            const els = {
                hkDateText: document.getElementById('hk-date-text'),
                hkCountdownText: document.getElementById('hk-countdown-text'),
                puzzleTypeBadge: document.getElementById('puzzle-type-badge'),
                fontToggleBtn: document.getElementById('font-toggle-btn'),
                statSolved: document.getElementById('stat-solved'),
                statStreak: document.getElementById('stat-streak'),
                timerContainer: document.getElementById('timer-container'),
                diffBtns: document.querySelectorAll('.diff-btn'),
                coachIcon: document.getElementById('coach-icon'),
                coachText: document.getElementById('coach-text'),
                sudokuGrid: document.getElementById('sudoku-grid'),
                numpad: document.getElementById('numpad'),
                btnNote: document.getElementById('btn-note'),
                btnClear: document.getElementById('btn-clear'),
                btnCheck: document.getElementById('btn-check'),
                btnHint: document.getElementById('btn-hint'),
                btnTodayPuzzle: document.getElementById('btn-today-puzzle'),
                btnNewPractice: document.getElementById('btn-new-practice'),
                winModal: document.getElementById('win-modal'),
                modalPraise: document.getElementById('modal-praise'),
                modalStatsSummary: document.getElementById('modal-stats-summary'),
                modalNextPractice: document.getElementById('modal-next-practice'),
                modalCloseBtn: document.getElementById('modal-close-btn')
            };

            function setCoachMessage(icon, text) {
                els.coachIcon.textContent = icon;
                els.coachText.textContent = text;
            }

            function applyFontPreference() {
                if (state.largeFont) {
                    document.body.classList.add('large-font');
                    els.fontToggleBtn.classList.add('active');
                    els.fontToggleBtn.textContent = '🔍 標準字體';
                } else {
                    document.body.classList.remove('large-font');
                    els.fontToggleBtn.classList.remove('active');
                    els.fontToggleBtn.textContent = '🔍 特大字體';
                }
            }

            function updateStatsDisplay() {
                els.statSolved.textContent = `${state.stats.solvedCount} 題`;
                els.statStreak.textContent = `${state.stats.streakDays} 日`;
            }

            function renderTimerControl() {
                if (!state.showTimer) {
                    els.timerContainer.innerHTML = `<button type="button" id="timer-toggle-btn" class="timer-toggle-btn">顯示時間</button>`;
                    document.getElementById('timer-toggle-btn').addEventListener('click', () => {
                        state.showTimer = true;
                        renderTimerControl();
                    });
                } else {
                    const mins = String(Math.floor(state.elapsedSeconds / 60)).padStart(2, '0');
                    const secs = String(state.elapsedSeconds % 60).padStart(2, '0');
                    els.timerContainer.innerHTML = `<button type="button" id="timer-toggle-btn" class="stat-value" style="background:none;border:none;cursor:pointer;padding:0;" title="點擊隱藏計時">${mins}:${secs}</button>`;
                    document.getElementById('timer-toggle-btn').addEventListener('click', () => {
                        state.showTimer = false;
                        renderTimerControl();
                    });

            }

            function updateScheduleUI() {
                const schedule = getHKScheduleState();
                els.hkDateText.textContent = schedule.dateDisplay;
                els.hkCountdownText.textContent = schedule.countdownLabel;
                return schedule;
            }

            // ==========================================
            // 7. 載入題目與渲染棋盤 / 鍵盤
            // ==========================================
            function loadPuzzle(difficulty, isDaily) {
                const schedule = updateScheduleUI();
                state.currentDailyDateKey = schedule.dateKey;
                state.difficulty = difficulty;
                state.isDailyMode = isDaily;

                // 更新難度按鈕樣式
                els.diffBtns.forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.diff === difficulty);
                });

                // 更新徽章
                if (isDaily) {
                    els.puzzleTypeBadge.textContent = '今日每日題';
                    els.puzzleTypeBadge.classList.remove('practice');
                } else {
                    els.puzzleTypeBadge.textContent = '自由練習題';
                    els.puzzleTypeBadge.classList.add('practice');
                }

                // 組合種子字串
                let seedStr;
                if (isDaily) {
                    seedStr = `HK-DAILY-9AM-${schedule.dateKey}-${difficulty}`;
                } else {
                    state.practiceCounter += 1;
                    seedStr = `HK-PRACTICE-${Date.now()}-${state.practiceCounter}-${difficulty}`;
                }

                const generated = generateSudokuPuzzle(difficulty, seedStr);
                state.size = generated.size;
                state.boxRows = generated.boxRows;
                state.boxCols = generated.boxCols;
                state.initial = generated.puzzle.slice();
                state.solution = generated.solution.slice();
                state.board = generated.puzzle.slice();
                state.notes = Array.from({ length: state.size * state.size }, () => new Set());
                state.errors = new Array(state.size * state.size).fill(false);
                state.isCompleted = false;
                state.elapsedSeconds = 0;

                // 預設選取第一個空白格方便直接輸入
                const firstEmpty = state.board.findIndex(v => v === 0);
                state.selectedIdx = firstEmpty !== -1 ? firstEmpty : 0;

                renderBoard();
                renderNumpad();
                renderTimerControl();

                if (isDaily) {
                    setCoachMessage('🌼', '今日專屬題目已準備好！點選空白格，再按下方數字鍵即可填入。');
                } else {
                    setCoachMessage('🎲', '已為你設計一道全新練習題，慢慢思考、輕鬆玩！');
                }
            }

            function renderBoard() {
                const size = state.size;
                els.sudokuGrid.className = `sudoku-grid ${size === 6 ? 'grid-6' : 'grid-9'}`;
                els.sudokuGrid.innerHTML = '';

                const selIdx = state.selectedIdx;
                const selRow = selIdx !== null ? Math.floor(selIdx / size) : -1;
                const selCol = selIdx !== null ? selIdx % size : -1;
                const selBoxR = selIdx !== null ? Math.floor(selRow / state.boxRows) : -1;
                const selBoxC = selIdx !== null ? Math.floor(selCol / state.boxCols) : -1;
                const selVal = (selIdx !== null && state.board[selIdx] !== 0) ? state.board[selIdx] : 0;

                for (let idx = 0; idx < size * size; idx++) {
                    const row = Math.floor(idx / size);
                    const col = idx % size;
                    const boxR = Math.floor(row / state.boxRows);
                    const boxC = Math.floor(col / state.boxCols);
                    const val = state.board[idx];
                    const isFixed = state.initial[idx] !== 0;

                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.setAttribute('role', 'gridcell');

                    // 宮格粗框線邏輯
                    if ((col + 1) % state.boxCols === 0 && col !== size - 1) {
                        cell.classList.add('thick-right');
                    }
                    if ((row + 1) % state.boxRows === 0 && row !== size - 1) {
                        cell.classList.add('thick-bottom');
                    }
                    if (col === size - 1) cell.classList.add('no-right');
                    if (row === size - 1) cell.classList.add('no-bottom');

                    if (isFixed) {
                        cell.classList.add('fixed');
                    } else if (val !== 0) {
                        cell.classList.add('user-val');
                    }

                    // 高亮同行、同列、同宮格
                    if (selIdx !== null) {
                        if (idx === selIdx) {
                            cell.classList.add('selected');
                        } else if (row === selRow || col === selCol || (boxR === selBoxR && boxC === selBoxC)) {
                            cell.classList.add('related');
                        }
                        if (selVal !== 0 && val === selVal && idx !== selIdx) {
                            cell.classList.add('same-num');
                        }
                    }

                    if (state.errors[idx]) {
                        cell.classList.add('error');
                    }

                    // 顯示數字或筆記小字
                    if (val !== 0) {
                        cell.textContent = String(val);
                    } else if (state.notes[idx].size > 0) {
                        const notesDiv = document.createElement('div');
                        notesDiv.className = 'notes-grid';
                        for (let n = 1; n <= size; n++) {
                            const span = document.createElement('span');
                            span.className = 'note-num';
                            span.textContent = state.notes[idx].has(n) ? String(n) : '';
                            notesDiv.appendChild(span);
                        }
                        cell.appendChild(notesDiv);
                    }

                    cell.addEventListener('click', () => {
                        state.selectedIdx = idx;
                        renderBoard();
                    });

                    els.sudokuGrid.appendChild(cell);
                }
            }

            function renderNumpad() {
                const size = state.size;
                els.numpad.className = `numpad ${size === 6 ? 'pad-6' : 'pad-9'}`;
                els.numpad.innerHTML = '';

                // 統計每個數字已填入數量
                const counts = new Array(size + 1).fill(0);
                state.board.forEach(v => {
                    if (v >= 1 && v <= size) counts[v]++;
                });

                for (let n = 1; n <= size; n++) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'num-btn';
                    if (state.noteMode) btn.classList.add('note-mode-active');
                    if (counts[n] >= size) btn.classList.add('completed');
                    btn.textContent = String(n);
                    btn.setAttribute('aria-label', `輸入數字 ${n}`);

                    btn.addEventListener('click', () => handleNumberInput(n));
                    els.numpad.appendChild(btn);
                }
            }

            // ==========================================
            // 8. 玩家操作邏輯（輸入、筆記、清除、檢查、提示）
            // ==========================================
            function handleNumberInput(num) {
                if (state.isCompleted) return;
                const idx = state.selectedIdx;
                if (idx === null) {
                    setCoachMessage('👆', '請先點選棋盤上的一個空格，再按數字鍵喔！');
                    return;
                }
                if (state.initial[idx] !== 0) {
                    setCoachMessage('🔒', '呢格係題目原本提供嘅數字，唔需要改動，請揀其他空格啦！');
                    return;
                }

                // 清除該格的錯誤標記
                state.errors[idx] = false;

                if (state.noteMode) {
                    if (state.board[idx] !== 0) {
                        state.board[idx] = 0;
                    }
                    if (state.notes[idx].has(num)) {
                        state.notes[idx].delete(num);
                    } else {
                        state.notes[idx].add(num);
                    }
                    setCoachMessage('✏️', `已喺呢格記低「${num}」作為草稿筆記。`);
                    renderBoard();
                    renderNumpad();
                    return;
                }

                // 正式填入數字（若再按同一個數字則清除）
                if (state.board[idx] === num) {
                    state.board[idx] = 0;
                } else {
                    state.board[idx] = num;
                    state.notes[idx].clear();
                    clearRelatedNotes(idx, num);
                }

                renderBoard();
                renderNumpad();
                checkWinCondition();
            }

            function clearRelatedNotes(idx, num) {
                const size = state.size;
                const row = Math.floor(idx / size);
                const col = idx % size;
                const boxR = Math.floor(row / state.boxRows);
                const boxC = Math.floor(col / state.boxCols);

                for (let i = 0; i < size * size; i++) {
                    const r = Math.floor(i / size);
                    const c = i % size;
                    const bR = Math.floor(r / state.boxRows);
                    const bC = Math.floor(c / state.boxCols);
                    if (r === row || c === col || (bR === boxR && bC === boxC)) {
                        state.notes[i].delete(num);
                    }
                }
            }

            function handleClearCell() {
                if (state.isCompleted) return;
                const idx = state.selectedIdx;
                if (idx === null) {
                    setCoachMessage('👆', '請先點選你想清除的格子。');
                    return;
                }
                if (state.initial[idx] !== 0) {
                    setCoachMessage('🔒', '題目原本的數字唔可以清除喔！');
                    return;
                }
                state.board[idx] = 0;
                state.notes[idx].clear();
                state.errors[idx] = false;
                setCoachMessage('🧹', '已經幫你清空格子啦，可以重新思考填入。');
                renderBoard();
                renderNumpad();
            }

            function handleCheckMistakes() {
                if (state.isCompleted) return;
                let wrongCount = 0;
                let filledUserCount = 0;

                for (let i = 0; i < state.board.length; i++) {
                    if (state.initial[i] === 0 && state.board[i] !== 0) {
                        filledUserCount++;
                        if (state.board[i] !== state.solution[i]) {
                            state.errors[i] = true;
                            wrongCount++;
                        } else {
                            state.errors[i] = false;
                        }
                    } else {
                        state.errors[i] = false;
                    }
                }

                renderBoard();

                if (filledUserCount === 0) {
                    setCoachMessage('🌼', '你仲未填入任何數字喔，放心試下填一格先啦！');
                } else if (wrongCount > 0) {
                    setCoachMessage('🔍', `發現有 ${wrongCount} 個數字同答案唔太夾（已用柔和紅色標示），唔使急，慢慢再睇睇同橫行、直列或同宮格有冇重複！`);
                } else {
                    setCoachMessage('🌟', '好叻呀！目前填入嘅所有數字全部正確，繼續加油！');
                }
            }

            function handleSmartHint() {
                if (state.isCompleted) return;

                // 優先找「目前只剩唯一一個合法候選數字」的空格，方便給予清晰邏輯解釋
                const size = state.size;
                let targetIdx = -1;
                let reasonText = '';

                const emptyIndices = [];
                for (let i = 0; i < state.board.length; i++) {
                    if (state.board[i] === 0 || state.board[i] !== state.solution[i]) {
                        emptyIndices.push(i);
                    }
                }

                if (emptyIndices.length === 0) return;

                // 檢查是否有「單一候選數」格子
                for (let k = 0; k < emptyIndices.length; k++) {
                    const idx = emptyIndices[k];
                    const r = Math.floor(idx / size);
                    const c = idx % size;
                    const bR = Math.floor(r / state.boxRows);
                    const bC = Math.floor(c / state.boxCols);

                    const used = new Set();
                    for (let i = 0; i < size; i++) {
                        if (state.board[r * size + i] !== 0) used.add(state.board[r * size + i]);
                        if (state.board[i * size + c] !== 0) used.add(state.board[i * size + c]);
                    }
                    for (let dr = 0; dr < state.boxRows; dr++) {
                        for (let dc = 0; dc < state.boxCols; dc++) {
                            const val = state.board[(bR * state.boxRows + dr) * size + (bC * state.boxCols + dc)];
                            if (val !== 0) used.add(val);
                        }
                    }

                    if (used.size === size - 1) {
                        targetIdx = idx;
                        const ans = state.solution[idx];
                        reasonText = `第 ${r + 1} 行、第 ${c + 1} 列：睇下呢一橫行、直列同宮格，1 到 ${size} 入面其他數字都已經出現晒，所以呢格只可以填「${ans}」！`;
                        break;
                    }
                }

                // 若無單一候選數，則優先協助目前選取的空格或第一個未完成格子
                if (targetIdx === -1) {
                    if (state.selectedIdx !== null && (state.board[state.selectedIdx] === 0 || state.board[state.selectedIdx] !== state.solution[state.selectedIdx])) {
                        targetIdx = state.selectedIdx;
                    } else {
                        targetIdx = emptyIndices[0];
                    }
                    const r = Math.floor(targetIdx / size);
                    const c = targetIdx % size;
                    const ans = state.solution[targetIdx];
                    reasonText = `第 ${r + 1} 行、第 ${c + 1} 列：經過排除同橫行、直列同宮格重複嘅數字之後，呢格嘅正確答案係「${ans}」，已經幫你填好啦！`;
                }

                const correctNum = state.solution[targetIdx];
                state.selectedIdx = targetIdx;
                state.board[targetIdx] = correctNum;
                state.notes[targetIdx].clear();
                state.errors[targetIdx] = false;
                clearRelatedNotes(targetIdx, correctNum);

                renderBoard();
                renderNumpad();
                setCoachMessage('💡', reasonText);
                checkWinCondition();
            }

            // ==========================================
            // 9. 過關判定、打卡統計與彩帶動畫
            // ==========================================
            function checkWinCondition() {
                for (let i = 0; i < state.board.length; i++) {
                    if (state.board[i] !== state.solution[i]) return;
                }

                state.isCompleted = true;
                const todayKey = state.currentDailyDateKey || getHKScheduleState().dateKey;

                // 更新已完成題數與連續打卡日數
                state.stats.solvedCount += 1;

                if (state.stats.lastSolvedDate !== todayKey) {
                    // 計算昨日日期字串
                    const parts = todayKey.split('-').map(Number);
                    const d = new Date(parts[0], parts[1] - 1, parts[2]);
                    d.setDate(d.getDate() - 1);
                    const yesterdayKey = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

                    if (state.stats.lastSolvedDate === yesterdayKey) {
                        state.stats.streakDays += 1;
                    } else {
                        state.stats.streakDays = 1;
                    }
                    state.stats.lastSolvedDate = todayKey;
                }

                SafeStorage.set('mom_sudoku_stats', state.stats);
                updateStatsDisplay();

                const praise = PRAISE_MESSAGES[state.stats.solvedCount % PRAISE_MESSAGES.length];
                els.modalPraise.textContent = praise;
                els.modalStatsSummary.textContent = `累計完成：${state.stats.solvedCount} 題 ｜ 連續打卡：${state.stats.streakDays} 日`;
                els.winModal.classList.add('show');

                setCoachMessage('🎉', '恭喜過關！全部數字完全正確，真係好犀利！');
                launchConfetti();
            }

            function launchConfetti() {
                const canvas = document.getElementById('confetti-canvas');
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                const colors = ['#F59E0B', '#10B981', '#3B82F6', '#EC4899', '#8B5CF6', '#EF4444'];
                const pieces = Array.from({ length: 90 }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 6,
                    h: Math.random() * 6 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 3.5 + 2,
                    speedX: (Math.random() - 0.5) * 2.5,
                    angle: Math.random() * Math.PI * 2,
                    spin: (Math.random() - 0.5) * 0.15
                }));

                let frame = 0;
                function animate() {
                    frame++;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    pieces.forEach(p => {
                        p.y += p.speedY;
                        p.x += p.speedX;
                        p.angle += p.spin;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate(p.angle);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                        ctx.restore();
                    });
                    if (frame < 160) {
                        requestAnimationFrame(animate);
                    } else {
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                }
                requestAnimationFrame(animate);
            }

            // ==========================================
            // 10. 綁定事件與定時監聽每日 09:00 跨日更新
            // ==========================================
            function bindEvents() {
                els.fontToggleBtn.addEventListener('click', () => {
                    state.largeFont = !state.largeFont;
                    SafeStorage.set('mom_sudoku_large_font', state.largeFont);
                    applyFontPreference();
                });

                els.diffBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const diff = btn.dataset.diff;
                        loadPuzzle(diff, state.isDailyMode);
                    });
                });

                els.btnNote.addEventListener('click', () => {
                    state.noteMode = !state.noteMode;
                    els.btnNote.classList.toggle('active', state.noteMode);
                    renderNumpad();
                    if (state.noteMode) {
                        setCoachMessage('✏️', '筆記模式已開啟：按數字鍵可以喺格子入面記低候選小字。');
                    } else {
                        setCoachMessage('🔢', '已切換返正常填字模式。');
                    }
                });

                els.btnClear.addEventListener('click', handleClearCell);
                els.btnCheck.addEventListener('click', handleCheckMistakes);
                els.btnHint.addEventListener('click', handleSmartHint);

                els.btnTodayPuzzle.addEventListener('click', () => {
                    loadPuzzle(state.difficulty, true);
                });

                els.btnNewPractice.addEventListener('click', () => {
                    loadPuzzle(state.difficulty, false);
                });

                els.modalNextPractice.addEventListener('click', () => {
                    els.winModal.classList.remove('show');
                    loadPuzzle(state.difficulty, false);
                });

                els.modalCloseBtn.addEventListener('click', () => {
                    els.winModal.classList.remove('show');
                });

                // 支援實體鍵盤方向鍵與數字鍵輸入
                document.addEventListener('keydown', (e) => {
                    if (els.winModal.classList.contains('show')) return;
                    const size = state.size;
                    if (e.key >= '1' && e.key <= String(size)) {
                        handleNumberInput(Number(e.key));
                    } else if (e.key === 'Backspace' || e.key === 'Delete') {
                        handleClearCell();
                    } else if (state.selectedIdx !== null && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                        e.preventDefault();
                        let r = Math.floor(state.selectedIdx / size);
                        let c = state.selectedIdx % size;
                        if (e.key === 'ArrowUp') r = (r - 1 + size) % size;
                        if (e.key === 'ArrowDown') r = (r + 1) % size;
                        if (e.key === 'ArrowLeft') c = (c - 1 + size) % size;
                        if (e.key === 'ArrowRight') c = (c + 1) % size;
                        state.selectedIdx = r * size + c;
                        renderBoard();
                    }
                });
            }

            function initApp() {
                try {
                    applyFontPreference();
                    updateStatsDisplay();
                    bindEvents();
                    loadPuzzle('6x6', true);

                    // 每秒更新倒數計時；若網頁跨過香港時間上午 09:00，自動設計並載入今日全新題目
                    setInterval(() => {
                        const latest = updateScheduleUI();
                        if (state.currentDailyDateKey && latest.dateKey !== state.currentDailyDateKey) {
                            state.currentDailyDateKey = latest.dateKey;
                            loadPuzzle(state.difficulty, true);
                            setCoachMessage('🌅', '早晨！已經過咗上午 09:00，今日全新嘅每日數獨題目已經自動設計好喇！');
                        }

                        if (!state.isCompleted) {
                            state.elapsedSeconds += 1;
                            if (state.showTimer) {
                                renderTimerControl();
                            }
                        }
                    }, 1000);
                } catch (err) {
                    const fallback = document.getElementById('error-fallback');
                    if (fallback) {
                        fallback.style.display = 'block';
                        fallback.textContent = '載入遊戲時發生了一點小問題，請重新整理頁面再試：' + (err && err.message ? err.message : err);
                    }
                }
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }
        })();
    </script>
</body>
